<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HỌC TẬP ĐOÀN VIÊN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#0f766e;--dark:#0f172a;--bg:#f1f5f9;--card:#fff;--muted:#64748b;--danger:#dc2626;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#0f172a}.hidden{display:none!important}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:700}button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:var(--danger)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0f766e,#0f172a)}.auth-card{width:min(480px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 25px 80px #0005}.brand{font-size:28px;font-weight:900}.subtitle{color:var(--muted);margin:7px 0 24px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;background:#e2e8f0;color:#334155}.tabs button.active{background:var(--primary);color:#fff}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.msg{padding:10px 12px;border-radius:10px;background:#fef3c7;color:#92400e;margin:12px 0;font-size:14px}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}
.app{display:flex;min-height:100vh}.side{width:245px;background:var(--dark);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.side .logo{font-weight:900;font-size:18px;padding:0 10px 22px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.main{margin-left:245px;width:calc(100% - 245px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.user{font-size:13px;color:var(--muted)}.content{padding:28px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.stat{font-size:30px;font-weight:900;margin-top:8px}.muted{color:var(--muted)}.course h3{margin:0 0 8px}.course p{color:var(--muted);min-height:42px}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.lesson{padding:15px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.lesson.done{border-color:#86efac;background:#f0fdf4}.question{margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:14px}.option{display:flex;gap:9px;padding:8px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.badge.ok{background:#dcfce7;color:#166534}.badge.no{background:#fee2e2;color:#991b1b}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:14px}.empty{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:800px){.side{width:72px}.side .logo{font-size:0}.side .logo:after{content:'ĐV';font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:22px}.main{margin-left:72px;width:calc(100% - 72px)}.content{padding:18px}.top{padding:0 15px}}
</style></head>
<body>
<div id="auth" class="auth"><div class="auth-card">
<div class="brand" id="authBrand">HỌC TẬP ĐOÀN VIÊN</div><div class="subtitle" id="authSubtitle">Nền tảng học tập và kiểm tra trực tuyến</div>
<div class="tabs"><button id="loginTab" class="active">Đăng nhập</button><button id="signupTab">Đăng ký</button></div>
<div id="loginForm"><div class="field"><label>Tên đăng nhập</label><input id="loginUser" autocomplete="username" placeholder="Tên đăng nhập"></div><div class="field"><label>Mật khẩu</label><input id="loginPass" type="password" autocomplete="current-password"></div><button style="width:100%" id="loginBtn">Đăng nhập</button></div>
<div id="signupForm" class="hidden"><div class="field"><label>Họ và tên</label><input id="fullName" autocomplete="name" required></div><div class="field"><label>Số điện thoại</label><input id="phone" type="tel" autocomplete="tel" required></div><div class="field"><label>Tên đăng nhập</label><input id="signupUser" autocomplete="username" minlength="3" required></div><div class="field"><label>Mật khẩu</label><input id="signupPass" type="password" autocomplete="new-password" minlength="6" required></div><button style="width:100%" id="signupBtn">Tạo tài khoản</button></div>
<div id="authMsg" class="msg hidden"></div>
</div></div>

<div id="app" class="app hidden"><aside class="side"><div class="logo" id="sideBrand">HỌC TẬP ĐOÀN VIÊN</div><div class="nav"><button data-page="dashboard">🏠 Tổng quan</button><button data-page="courses">📚 Khóa học</button><button data-page="exams">📝 Kỳ thi</button><button data-page="history">🕘 Lịch sử học tập</button><button data-page="profile">👤 Tài khoản</button><button data-page="admin" id="adminNav" class="hidden">⚙️ Quản trị</button></div></aside>
<main class="main"><header class="top"><div><b id="pageTitle">Tổng quan</b></div><div class="row"><span class="user" id="userInfo"></span><button class="secondary" id="logoutBtn">Đăng xuất</button></div></header><section class="content" id="view"></section></main></div>

<script>
const SUPABASE_URL='https://noafrcwfuddxclwuhfsm.supabase.co';
const SUPABASE_KEY='sb_publishable_Y_uZf1WFw51g3TEuG2Y3EQ_RBe1WWLr';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,settings:null,orgs:[],page:'dashboard',course:null,exam:null,attempt:null,timer:null};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function msg(t,kind=''){const e=$('authMsg');e.textContent=t;e.className='msg '+kind;e.classList.remove('hidden')}
async function settings(){let {data}=await sb.from('site_settings').select('*').eq('id',true).maybeSingle();state.settings=data||{};document.title=state.settings.site_name||'HỌC TẬP ĐOÀN VIÊN';$('authBrand').textContent=state.settings.site_name||'HỌC TẬP ĐOÀN VIÊN';$('sideBrand').textContent=state.settings.site_name||'HỌC TẬP ĐOÀN VIÊN';$('authSubtitle').textContent=state.settings.site_subtitle||'';if(state.settings.primary_color)document.documentElement.style.setProperty('--primary',state.settings.primary_color);}
async function loadOrgs(){let {data}=await sb.from('organizations').select('*').eq('is_active',true).order('sort_order').order('name');state.orgs=data||[];fillOrgs()}
function fillOrgs(){}
async function init(){await settings();await loadOrgs();const {data:{session}}=await sb.auth.getSession();if(session) await enter(session.user);else $('auth').classList.remove('hidden')}
async function enter(user){state.user=user;let {data:profile}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();state.profile=profile; $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userInfo').textContent=(profile?.full_name||profile?.username||user.email)+' · '+(profile?.role||'member');$('adminNav').classList.toggle('hidden',!['super_admin','admin','moderator','unit_admin','chapter_admin'].includes(profile?.role));go('dashboard')}
async function go(page){state.page=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('pageTitle').textContent={dashboard:'Tổng quan',courses:'Khóa học',exams:'Kỳ thi',history:'Lịch sử học tập',profile:'Tài khoản',admin:'Quản trị'}[page]||'';if(page==='dashboard')return dashboard();if(page==='courses')return courses();if(page==='exams')return exams();if(page==='history')return history();if(page==='profile')return profile();if(page==='admin')return admin();}
async function dashboard(){let [{data:c},{data:e},{data:p}]=await Promise.all([sb.from('courses').select('id,title,description,duration_minutes,passing_score').eq('status','published'),sb.from('exams').select('id,title,duration_minutes,passing_score').eq('is_published',true),sb.from('exam_attempts').select('id,score,passed').eq('user_id',state.user.id)]);$('view').innerHTML=`<h1>Xin chào, ${esc(state.profile?.full_name||'Đoàn viên')} 👋</h1><p class="muted">Học tập, kiểm tra và lưu lịch sử đào tạo trên một nền tảng.</p><div class="grid"><div class="card"><div class="muted">Khóa học mở</div><div class="stat">${c?.length||0}</div></div><div class="card"><div class="muted">Kỳ thi</div><div class="stat">${e?.length||0}</div></div><div class="card"><div class="muted">Lượt thi đã thực hiện</div><div class="stat">${p?.length||0}</div></div></div><div style="height:16px"></div><div class="grid">${(c||[]).slice(0,3).map(x=>courseCard(x)).join('')}</div>`}
function courseCard(c){return `<div class="card course"><span class="badge">${c.duration_minutes||0} phút</span><h3>${esc(c.title)}</h3><p>${esc(c.description||'')}</p><button onclick="openCourse('${c.id}')">Vào khóa học</button></div>`}
async function courses(){let {data:c,error}=await sb.from('courses').select('*').eq('status','published').order('created_at',{ascending:false});$('view').innerHTML=`<div class="row space"><div><h1>Khóa học</h1><p class="muted">Các nội dung đang được mở cho đoàn viên.</p></div></div><div class="grid">${error?`<div class="card error">${esc(error.message)}</div>`:(c||[]).map(courseCard).join('')}</div>`}
async function openCourse(id){let [{data:c},{data:l},{data:en},{data:prog},{data:ex}]=await Promise.all([sb.from('courses').select('*').eq('id',id).single(),sb.from('lessons').select('*').eq('course_id',id).eq('is_published',true).order('sort_order'),sb.from('enrollments').select('*').eq('course_id',id).eq('user_id',state.user.id).maybeSingle(),sb.from('lesson_progress').select('*').eq('user_id',state.user.id),sb.from('exams').select('*').eq('course_id',id).eq('is_published',true).order('created_at')]);state.course=c;let enrollment=en;if(!enrollment){let r=await sb.from('enrollments').insert({user_id:state.user.id,course_id:id}).select().single();enrollment=r.data}let done=(prog||[]).filter(x=>(l||[]).some(z=>z.id===x.lesson_id&&x.completed)).length;let pct=l?.length?Math.round(done/l.length*100):0;$('view').innerHTML=`<div class="row space"><div><button class="secondary" onclick="go('courses')">← Quay lại</button><h1>${esc(c.title)}</h1><p class="muted">${esc(c.description||'')}</p></div><span class="badge">Tiến độ ${pct}%</span></div><div class="card"><div class="progress"><i style="width:${pct}%"></i></div><h2>Nội dung</h2>${(l||[]).map(x=>{let d=(prog||[]).find(p=>p.lesson_id===x.id)?.completed;return `<div class="lesson ${d?'done':''}"><div class="row space"><div><b>${esc(x.sort_order+'. '+x.title)}</b><div class="muted">${x.duration_minutes||0} phút</div></div><button onclick="openLesson('${x.id}')">${d?'Xem lại':'Học bài'}</button></div></div>`}).join('')||'<div class="empty">Chưa có bài học.</div>'}</div><div style="height:16px"></div><div class="card"><h2>Kỳ thi</h2>${(ex||[]).map(x=>`<div class="lesson"><div class="row space"><div><b>${esc(x.title)}</b><div class="muted">${x.duration_minutes} phút · đạt ${x.passing_score}%</div></div><button onclick="startExam('${x.id}')">Bắt đầu thi</button></div></div>`).join('')||'<div class="empty">Chưa có kỳ thi.</div>'}</div>`}
async function openLesson(id){let {data:l}=await sb.from('lessons').select('*').eq('id',id).single();let {data:p}=await sb.from('lesson_progress').select('*').eq('user_id',state.user.id).eq('lesson_id',id).maybeSingle();$('view').innerHTML=`<button class="secondary" onclick="openCourse('${l.course_id}')">← Quay lại khóa học</button><div class="card" style="margin-top:16px"><h1>${esc(l.title)}</h1><p class="muted">${l.duration_minutes||0} phút</p><div style="white-space:pre-wrap;line-height:1.8">${esc(l.content||'')}</div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><button onclick="completeLesson('${l.id}','${l.course_id}')">${p?.completed?'✓ Đã hoàn thành':'Đánh dấu hoàn thành'}</button></div>`}
async function completeLesson(id,courseId){let r=await sb.from('lesson_progress').upsert({user_id:state.user.id,lesson_id:id,progress_percent:100,completed:true},{onConflict:'user_id,lesson_id'});if(r.error)alert(r.error.message);else openCourse(courseId)}
async function exams(){let {data:e}=await sb.from('exams').select('*,courses(title)').eq('is_published',true);$('view').innerHTML=`<h1>Kỳ thi</h1><p class="muted">Các bài kiểm tra đang mở.</p><div class="grid">${(e||[]).map(x=>`<div class="card"><span class="badge">${x.duration_minutes} phút</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.courses?.title||'')} · đạt ${x.passing_score}% · tối đa ${x.attempt_limit} lượt</p><button onclick="startExam('${x.id}')">Bắt đầu thi</button></div>`).join('')}</div>`}
async function startExam(examId){let r=await sb.rpc('start_exam',{p_exam_id:examId});if(r.error){alert(r.error.message);return}state.attempt=r.data;let [{data:e},{data:q,error:qerr}]=await Promise.all([sb.from('exams').select('*').eq('id',examId).single(),sb.rpc('get_exam_questions',{p_exam_id:examId})]);if(qerr){alert(qerr.message);return}state.exam={...e,questions:q||[]};renderExam()}
function renderExam(){let e=state.exam;let html=`<div class="row space"><div><h1>${esc(e.title)}</h1><p class="muted">${esc(e.description||'')}</p></div><span class="badge" id="timer">${e.duration_minutes}:00</span></div><form id="examForm">${e.questions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.question_text)}</b>${(q.question_options||[]).sort((a,b)=>a.sort_order-b.sort_order).map(o=>`<label class="option"><input type="${q.question_type==='multiple'?'checkbox':'radio'}" name="q_${q.id}" value="${o.id}"> ${esc(o.option_text)}</label>`).join('')}</div>`).join('')}<button type="submit">Nộp bài</button></form>`;$('view').innerHTML=html;let end=Date.now()+e.duration_minutes*60000;state.timer=setInterval(()=>{let s=Math.max(0,Math.floor((end-Date.now())/1000));$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(state.timer);submitExam(true)}},1000);$('examForm').onsubmit=ev=>{ev.preventDefault();submitExam(false)}}
async function submitExam(auto){clearInterval(state.timer);let answers=state.exam.questions.map(q=>({question_id:q.id,selected_option_ids:[...document.querySelectorAll(`[name="q_${q.id}"]:checked`)].map(x=>x.value)}));let r=await sb.rpc('submit_exam',{p_attempt_id:state.attempt,p_answers:answers});if(r.error){alert(r.error.message);return}let x=r.data?.[0];$('view').innerHTML=`<div class="card" style="max-width:700px;margin:auto;text-align:center"><div style="font-size:54px">${x.passed?'🎉':'📘'}</div><h1>${x.passed?'Đạt':'Chưa đạt'}</h1><div class="stat">${x.score}%</div><p class="muted">${x.passed?'Bạn đã hoàn thành bài kiểm tra.':'Bạn có thể học lại và thử lại nếu còn lượt.'}</p><button onclick="go('history')">Xem lịch sử</button></div>`}
async function history(){let {data:a}=await sb.from('exam_attempts').select('*,exams(title,passing_score)').eq('user_id',state.user.id).order('started_at',{ascending:false});let {data:p}=await sb.from('lesson_progress').select('*,lessons(title,courses(title))').eq('user_id',state.user.id).order('updated_at',{ascending:false});$('view').innerHTML=`<h1>Lịch sử học tập</h1><div class="card"><h2>Kết quả thi</h2><table class="table"><thead><tr><th>Kỳ thi</th><th>Điểm</th><th>Kết quả</th><th>Thời gian</th></tr></thead><tbody>${(a||[]).map(x=>`<tr><td>${esc(x.exams?.title||'')}</td><td>${x.score==null?'Chưa nộp':x.score+'%'}</td><td>${x.passed==null?'—':x.passed?'<span class="badge ok">Đạt</span>':'<span class="badge no">Chưa đạt</span>'}</td><td>${new Date(x.started_at).toLocaleString('vi-VN')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Chưa có dữ liệu.</td></tr>'}</tbody></table></div><div style="height:16px"></div><div class="card"><h2>Bài học đã hoàn thành</h2>${(p||[]).filter(x=>x.completed).map(x=>`<div class="lesson done"><b>✓ ${esc(x.lessons?.title||'')}</b><div class="muted">${esc(x.lessons?.courses?.title||'')} · ${new Date(x.updated_at).toLocaleString('vi-VN')}</div></div>`).join('')||'<div class="empty">Chưa hoàn thành bài học nào.</div>'}</div>`}
function profile(){const chapters=state.orgs.filter(x=>x.org_type==='chapter');$('view').innerHTML=`<h1>Tài khoản</h1><div class="card" style="max-width:700px"><div class="field"><label>Họ và tên</label><input id="pName" value="${esc(state.profile?.full_name||'')}"></div><div class="field"><label>Số điện thoại</label><input id="pPhone" value="${esc(state.profile?.phone||'')}"></div><div class="field"><label>Tên đăng nhập</label><input value="${esc(state.profile?.username||'')}" disabled></div><div class="field"><label>Vai trò</label><input value="${esc(state.profile?.role||'member')}" disabled></div><div class="field"><label>Ghi danh Chi đoàn</label><select id="pChapter"><option value="">-- Chưa chọn Chi đoàn --</option>${chapters.map(x=>`<option value="${x.id}" ${x.id===state.profile?.organization_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><p class="muted">Bạn có thể chọn hoặc đổi Chi đoàn tại đây. Danh sách chỉ gồm các Chi đoàn đang hoạt động.</p></div><button onclick="saveProfile()">Lưu thông tin</button></div>`}
async function saveProfile(){const chapter=$('pChapter').value||null;let r=await sb.from('profiles').update({full_name:$('pName').value.trim(),phone:$('pPhone').value.trim(),organization_id:chapter}).eq('id',state.user.id);if(r.error)alert('Không lưu được: '+r.error.message);else{state.profile.full_name=$('pName').value.trim();state.profile.phone=$('pPhone').value.trim();state.profile.organization_id=chapter;alert('Đã lưu thông tin tài khoản và Chi đoàn.')}}
async function admin(){
 if(!['super_admin','admin','moderator','unit_admin','chapter_admin'].includes(state.profile?.role)){alert('Bạn không có quyền quản trị');return}
 const [{data:courses,error:ce},{data:orgs,error:oe},{data:users,error:ue},{data:lessons,error:le},{data:examsData,error:ee}] = await Promise.all([
  sb.from('courses').select('*').order('created_at',{ascending:false}),
  sb.from('organizations').select('*').order('org_type').order('sort_order'),
  sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(100),
  sb.from('lessons').select('id,title,course_id,is_published,sort_order,duration_minutes').order('course_id').order('sort_order'),
  sb.from('exams').select('id,title,course_id,is_published,duration_minutes,passing_score,attempt_limit').order('created_at',{ascending:false})
 ]);
 const courseRows=(courses||[]).map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.status)}</td><td>${c.duration_minutes||0} phút</td><td><button class="secondary" onclick="toggleCourse('${c.id}','${c.status}')">${c.status==='published'?'Ẩn khóa học':'Xuất bản'}</button></td></tr>`).join('');
 const lessonRows=(lessons||[]).map(l=>`<tr><td>${esc(l.title)}</td><td>${esc((courses||[]).find(c=>c.id===l.course_id)?.title||'')}</td><td>${l.is_published?'Đã xuất bản':'Bản nháp'}</td><td><button class="secondary" onclick="toggleLesson('${l.id}',${!l.is_published})">${l.is_published?'Ẩn':'Xuất bản'}</button></td></tr>`).join('');
 const examRows=(examsData||[]).map(e=>`<tr><td>${esc(e.title)}</td><td>${esc((courses||[]).find(c=>c.id===e.course_id)?.title||'')}</td><td>${e.is_published?'Đang mở':'Bản nháp'}</td><td><button class="secondary" onclick="toggleExam('${e.id}',${!e.is_published})">${e.is_published?'Đóng kỳ thi':'Mở kỳ thi'}</button></td></tr>`).join('');
 $('view').innerHTML=`<h1>Quản trị hệ thống</h1>
 <div class="grid"><div class="card"><div class="muted">Đoàn viên (100 gần nhất)</div><div class="stat">${users?.length||0}</div></div><div class="card"><div class="muted">Khóa học</div><div class="stat">${courses?.length||0}</div></div><div class="card"><div class="muted">Bài học</div><div class="stat">${lessons?.length||0}</div></div><div class="card"><div class="muted">Kỳ thi</div><div class="stat">${examsData?.length||0}</div></div></div>
 ${[ce,oe,ue,le,ee].some(Boolean)?`<div class="msg error">Một số dữ liệu quản trị không tải được. Hãy kiểm tra quyền RLS của vai trò hiện tại.</div>`:''}

function updateOrgParentOptions(){const type=$('orgType')?.value,parent=$('orgParent');if(!parent)return;const allowed=type==='unit'?'upper':type==='chapter'?'unit':null;const opts=(state.orgs||[]).filter(o=>!allowed||o.org_type===allowed);parent.innerHTML=(type==='upper'?'<option value="">Không có (cấp trên cùng)</option>':'<option value="">-- Chọn đơn vị cấp trên --</option>')+opts.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');}
async function createOrganization(){if(state.profile?.role!=='super_admin')return alert('Chỉ Super Admin được quản lý cây tổ chức.');const org_type=$('orgType').value,name=$('orgName').value.trim(),code=$('orgCode').value.trim()||null,parent_id=$('orgParent').value||null;if(!name)return alert('Vui lòng nhập tên đơn vị.');if(org_type==='upper'&&parent_id)return alert('Đoàn cấp trên không cần đơn vị cha.');if(org_type!=='upper'&&!parent_id)return alert('Hãy chọn đơn vị cấp trên.');const parent=(state.orgs||[]).find(o=>o.id===parent_id);if(org_type==='unit'&&parent?.org_type!=='upper')return alert('Đoàn cơ sở phải trực thuộc Đoàn cấp trên.');if(org_type==='chapter'&&parent?.org_type!=='unit')return alert('Chi đoàn phải trực thuộc Đoàn cơ sở.');const {error}=await sb.from('organizations').insert({name,code,org_type,parent_id,is_active:true,sort_order:(state.orgs||[]).filter(o=>o.parent_id===parent_id).length+1});if(error)return alert('Không tạo được đơn vị: '+error.message);alert('Đã thêm đơn vị.');await loadOrgs();admin()}
async function saveOrganization(id){if(state.profile?.role!=='super_admin')return alert('Chỉ Super Admin được quản lý cây tổ chức.');const name=$('org-name-'+id).value.trim(),code=$('org-code-'+id).value.trim()||null;if(!name)return alert('Tên đơn vị không được để trống.');const {error}=await sb.from('organizations').update({name,code}).eq('id',id);if(error)return alert('Không lưu được đơn vị: '+error.message);await loadOrgs();alert('Đã lưu đơn vị.');admin()}
async function saveUserRole(id){if(state.profile?.role!=='super_admin')return alert('Chỉ Super Admin được phân quyền.');const role=$('role-'+id).value;const {error}=await sb.from('profiles').update({role}).eq('id',id);if(error)return alert('Không cập nhật được vai trò: '+error.message);alert('Đã cập nhật vai trò.');await admin()}

let latestCourseProgressReport=[];
async function loadCourseProgressReport(){const host=$('courseProgressReport');if(!host)return;host.innerHTML='Đang tải báo cáo…';const [{data:rows,error:rerr},{data:orgs,error:oerr}]=await Promise.all([sb.from('course_progress_report').select('organization_id,course_id,title,enrolled_users,completed_users').order('title'),sb.from('organizations').select('id,name,org_type,parent_id')]);if(rerr||oerr){host.innerHTML=`<div class="msg error">Không tải được báo cáo tiến độ. ${esc((rerr||oerr).message||'Kiểm tra quyền RLS.')}</div>`;return}const orgMap=new Map((orgs||[]).map(o=>[o.id,o]));latestCourseProgressReport=(rows||[]).map(r=>{const o=orgMap.get(r.organization_id)||{};const parent=orgMap.get(o.parent_id)||{};return {...r,organization:o.name||'Chưa phân đơn vị',org_type:o.org_type||'',parent_name:parent.name||''}});const fmtType=t=>t==='unit'?'Đoàn cơ sở':t==='chapter'?'Chi đoàn':t==='upper'?'Đoàn cấp trên':'Chưa phân loại';host.innerHTML=latestCourseProgressReport.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Đơn vị</th><th>Cấp</th><th>Đơn vị cha</th><th>Khóa học</th><th>Đã đăng ký</th><th>Hoàn thành</th><th>Tỷ lệ</th></tr></thead><tbody>${latestCourseProgressReport.map(r=>`<tr><td>${esc(r.organization)}</td><td>${fmtType(r.org_type)}</td><td>${esc(r.parent_name||'—')}</td><td>${esc(r.title)}</td><td>${Number(r.enrolled_users)||0}</td><td>${Number(r.completed_users)||0}</td><td>${Number(r.enrolled_users)?Math.round(100*Number(r.completed_users)/Number(r.enrolled_users))+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu đăng ký học để tổng hợp.</div>'}
function exportCourseProgressReport(){if(!latestCourseProgressReport.length)return alert('Hãy tải báo cáo học tập trước khi xuất.');const cols=['Đơn vị','Cấp tổ chức','Đơn vị cha','Khóa học','Đã đăng ký','Hoàn thành','Tỷ lệ hoàn thành (%)'];const rows=latestCourseProgressReport.map(r=>[r.organization,r.org_type,r.parent_name,r.title,r.enrolled_users,r.completed_users,Number(r.enrolled_users)?Math.round(100*Number(r.completed_users)/Number(r.enrolled_users)):0]);const csv='\ufeff'+[cols,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='bao-cao-tien-do-hoc-tap.csv';a.click();URL.revokeObjectURL(url)}

async function createExam(){const title=$('newExamTitle').value.trim();if(!title)return alert('Vui lòng nhập tên kỳ thi.');const course_id=$('newExamCourse').value||null;const r=await sb.from('exams').insert({title,course_id,description:$('newExamDesc').value.trim(),duration_minutes:Math.max(1,Number($('newExamDuration').value)||15),passing_score:Math.min(100,Math.max(0,Number($('newExamPass').value)||70)),attempt_limit:Math.max(1,Number($('newExamLimit').value)||1),is_published:$('newExamPublish').checked,created_by:state.user.id});if(r.error)return alert('Không tạo được kỳ thi: '+r.error.message);alert('Đã tạo kỳ thi. Bạn có thể chọn kỳ thi này để thêm câu hỏi.');admin()}
async function createQuestion(){const exam_id=$('questionExam')?.value,question_text=$('newQuestionText')?.value.trim();if(!exam_id)return alert('Hãy tạo kỳ thi trước.');if(!question_text)return alert('Vui lòng nhập nội dung câu hỏi.');const options=[1,2,3,4].map(i=>$('questionOption'+i).value.trim());if(options.some(x=>!x))return alert('Vui lòng nhập đủ 4 phương án.');const correct=Number(document.querySelector('input[name="correctOption"]:checked')?.value||1);const q=await sb.from('questions').insert({exam_id,question_text,question_type:'single',points:Math.max(.1,Number($('newQuestionPoints').value)||1),sort_order:Date.now()%100000}).select('id').single();if(q.error)return alert('Không lưu được câu hỏi: '+q.error.message);const rows=options.map((option_text,i)=>({question_id:q.data.id,option_text,is_correct:i+1===correct,sort_order:i+1}));const o=await sb.from('question_options').insert(rows);if(o.error){await sb.from('questions').delete().eq('id',q.data.id);return alert('Không lưu được phương án: '+o.error.message+' (đã thử xóa câu hỏi chưa hoàn chỉnh)')}alert('Đã lưu câu hỏi và 4 phương án.');$('newQuestionText').value='';[1,2,3,4].forEach(i=>$('questionOption'+i).value='');}

function exportExamReport(){if(!latestExamReport.length)return alert('Hãy tải báo cáo trước khi xuất.');const cols=['Họ tên','Email','Đơn vị','Kỳ thi','Lần thi','Điểm (%)','Đạt','Thời điểm nộp'];const rows=latestExamReport.map(a=>[a.full_name,a.email,a.organization,a.exam_title,a.attempt_number,a.score,a.passed?'Đạt':'Chưa đạt',a.submitted_at]);const csv='\ufeff'+[cols,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const link=document.createElement('a');link.href=url;link.download='bao-cao-ket-qua-thi.csv';link.click();URL.revokeObjectURL(url)}

async function createCourse(){const title=$('newCourseTitle').value.trim(),slug=$('newCourseSlug').value.trim(),description=$('newCourseDesc').value.trim();if(!title||!slug)return alert('Vui lòng nhập tên khóa học và slug.');const r=await sb.from('courses').insert({title,slug,description,duration_minutes:Number($('newCourseDuration').value)||0,passing_score:Number($('newCoursePass').value)||70,status:$('newCoursePublish').checked?'published':'draft',created_by:state.user.id});if(r.error)return alert('Không tạo được khóa học: '+r.error.message);alert('Đã tạo khóa học.');admin()}
async function toggleCourse(id,current){const status=current==='published'?'draft':'published';const r=await sb.from('courses').update({status}).eq('id',id);if(r.error)return alert(r.error.message);admin()}
async function createLesson(){const course_id=$('newLessonCourse').value,title=$('newLessonTitle').value.trim(),content=$('newLessonContent').value.trim();if(!course_id||!title)return alert('Vui lòng chọn khóa học và nhập tên bài học.');const r=await sb.from('lessons').insert({course_id,title,content,duration_minutes:Number($('newLessonDuration').value)||0,sort_order:Number($('newLessonOrder').value)||1,is_published:$('newLessonPublish').checked});if(r.error)return alert('Không tạo được bài học: '+r.error.message);alert('Đã tạo bài học.');admin()}
async function toggleLesson(id,is_published){const r=await sb.from('lessons').update({is_published}).eq('id',id);if(r.error)return alert(r.error.message);admin()}
async function toggleExam(id,is_published){const r=await sb.from('exams').update({is_published}).eq('id',id);if(r.error)return alert(r.error.message);admin()}
async function saveSettings(){let r=await sb.from('site_settings').update({site_name:$('sName').value,site_subtitle:$('sSub').value,slogan:$('sSlogan').value}).eq('id',true);if(r.error)alert(r.error.message);else{await settings();alert('Đã lưu cấu hình')}}
$('loginTab').onclick=()=>{$('loginTab').classList.add('active');$('signupTab').classList.remove('active');$('loginForm').classList.remove('hidden');$('signupForm').classList.add('hidden')};$('signupTab').onclick=()=>{$('signupTab').classList.add('active');$('loginTab').classList.remove('active');$('signupForm').classList.remove('hidden');$('loginForm').classList.add('hidden')};
function authAlias(username){return username.trim().toLowerCase()+'@accounts.doan-elearning.meovatthongminh.workers.dev'}
$('loginBtn').onclick=async()=>{const username=$('loginUser').value.trim();if(!username)return msg('Nhập tên đăng nhập.','error');msg('Đang đăng nhập...');let r=await sb.auth.signInWithPassword({email:authAlias(username),password:$('loginPass').value});if(r.error)msg('Không đăng nhập được. Kiểm tra tên đăng nhập và mật khẩu. Nếu tài khoản cũ dùng email, hãy đăng nhập bằng email ở bản cũ hoặc liên hệ quản trị.','error');else await enter(r.data.user)};
$('signupBtn').onclick=async()=>{const full_name=$('fullName').value.trim(),phone=$('phone').value.trim(),username=$('signupUser').value.trim().toLowerCase(),password=$('signupPass').value;if(!full_name||!phone||!username||!password)return msg('Nhập đủ họ tên, số điện thoại, tên đăng nhập và mật khẩu.','error');if(!/^[a-z0-9._-]{3,30}$/.test(username))return msg('Tên đăng nhập dùng 3–30 ký tự: chữ không dấu, số, dấu chấm, gạch dưới hoặc gạch ngang.','error');if(password.length<6)return msg('Mật khẩu tối thiểu 6 ký tự.','error');msg('Đang tạo tài khoản...');const r=await sb.auth.signUp({email:authAlias(username),password,options:{data:{full_name,phone,username,contact_email:''}}});if(r.error)return msg(r.error.message,'error');if(r.data.session)await enter(r.data.user);else msg('Tài khoản đã tạo nhưng Supabase đang yêu cầu xác nhận email. Hãy tắt Confirm email trong Supabase Authentication để dùng đăng ký bằng username không cần email.','success')};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){state.user=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}});init();
</script></body></html>
